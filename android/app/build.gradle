plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Load keystore properties from key.properties file
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.keymatch.app"
    compileSdkVersion rootProject.ext.compileSdkVersion
    // ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.keymatch.app"
        // Note: This is overridden by flavor-specific applicationId settings
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = 217
        versionName = "134.10.0"
    }

    signingConfigs {
        release {
            // Try to use key.properties first (for local development)
            if (keystorePropertiesFile.exists()) {
                try {
                    storeFile file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                } catch (Exception e) {
                    // If keystore configuration fails, use debug signing
                    println "Warning: Keystore configuration failed, using debug signing for release build"
                    storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                    storePassword "android"
                    keyAlias "AndroidDebugKey"
                    keyPassword "android"
                }
            } else {
                // Fall back to environment variables (for CI/CD)
                def keystoreFile = System.getenv("MYAPP_UPLOAD_STORE_FILE")
                if (keystoreFile != null) {
                    storeFile file(keystoreFile)
                    storePassword System.getenv("MYAPP_UPLOAD_STORE_PASSWORD")
                    keyAlias System.getenv("MYAPP_UPLOAD_KEY_ALIAS")
                    keyPassword System.getenv("MYAPP_UPLOAD_KEY_PASSWORD")
                } else {
                    // If no keystore is available, use debug signing
                    println "Warning: No keystore available, using debug signing for release build"
                    storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                    storePassword "android"
                    keyAlias "AndroidDebugKey"
                    keyPassword "android"
                }
            }
        }
    }

    buildTypes {
        release {
            // Use release signing config
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // Add missing annotation libraries for Tink cryptography
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.google.errorprone:error_prone_annotations:2.11.0'
    // Add Material Design support for Stripe compatibility
    implementation 'com.google.android.material:material:1.11.0'
    // Firebase Cloud Messaging
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
}
